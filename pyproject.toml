[project]
name = "uav-inspector"
version = "0.1.0"
description = "反无人机设备巡检记录 -> 结构化运维报告 自动生成器"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
]

[project.scripts]
uav-inspect = "uav_inspector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uav_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=uav_inspector --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["uav_inspector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["uav_inspector"]
strict = true
warn_unused_ignores = true
